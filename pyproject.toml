[project]
name = "mcp-notes"
version = "0.1.0"
description = "MCP server for Cursor agents — controlled access to a markdown notes directory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.3.0",
]

[project.scripts]
notes-mcp = "notes_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
